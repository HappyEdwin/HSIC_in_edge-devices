model:
  name: "yolov4_tiny"
  type: "yolo"
  weights: "models/weights/yolov4_tiny_coco.pth"
  input_shape: [1, 3, 416, 416]
  img_size: 416
  num_classes: 80

dataset:
  name: "coco128"
  data_yaml: "coco128.yaml"
  split: "val"

export:
  onnx:
    output_path: "models/onnx/yolov4_tiny_416.onnx"
    opset: 12
    simplify: true
    dynamic_batch: false
  tensorrt:
    output_path: "models/engines/yolov4_tiny_416_int8.engine"
    precision: "INT8"
    workspace_gb: 4
    min_timing_iterations: 2
    avg_timing_iterations: 2

benchmark:
  warmup_runs: 50
  num_runs: 128
  batch_size: 1
  save_json: true
  save_csv: true
  results_dir: "results"
